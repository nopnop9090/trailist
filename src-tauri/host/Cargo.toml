[package]
name = "trailist-host"
version = "0.1.0"
edition = "2021"
description = "In-explorer forwarder for TrayList. Loaded into explorer.exe; the panel stays out of process."
publish = false

[lib]
name = "trailist_host"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "trailist-host-probe"
path = "src/bin/probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
base64 = "0.22"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
